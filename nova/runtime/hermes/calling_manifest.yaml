name: nova-calling
version: 1.0.0
description: >-
  NOVA Calling. Lets this agent request phone calls to contacts for its approved purposes and
  read where each request stands, and hand work to or report work for other agents along
  the tenant's delegation routes. It never dials and never assigns work itself: the gateway
  decides every request against consent, opt-outs, calling hours, limits, approval and the
  delegation routes. Installed and maintained by NOVA; edits here are overwritten on the
  next apply.
author: NOVA
kind: standalone
provides_tools:
  - request_call
  - call_status
  - delegate_work
  - delegation_status
  - report_delegation
